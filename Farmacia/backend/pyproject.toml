[project]
name = "farmacia-backend"
version = "0.1.0"
description = "Backend para el proyecto con fastAPI"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "sqlmodel>=0.0.22",
    "python-dotenv>=1.0.0",
    "psycopg[binary]>=3.3.9",
    "pyjwt>=2.15.1",
    "bcrypt>=5.0.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0.0", "httpx>=0.27.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
