
services:
  db:
    image: postgres:16-alpine
    container_name: farmacia_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: farmacia
      POSTGRES_PASSWORD: farmacia_dev
      POSTGRES_DB: farmacia_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U farmacia -d farmacia_db"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: farmacia_backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql+psycopg://farmacia:farmacia_dev@db:5432/farmacia_db
    volumes:
      - ./backend/app:/app/app
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: ./mi-primera-spa
      dockerfile: Dockerfile
    container_name: farmacia_frontend
    restart: unless-stopped
    ports:
      - "5173:5173"
    volumes:
      - ./mi-primera-spa/src:/app/src
    depends_on:
      - backend

volumes:
  postgres_data:
