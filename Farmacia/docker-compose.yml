services:
  db:
    image: postgres:16
    container_name: farmacia_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: farmacia
      POSTGRES_PASSWORD: farmacia_dev
      POSTGRES_DB: farmacia_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data: